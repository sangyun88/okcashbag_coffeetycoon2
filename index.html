<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Coffee Tycoon Brand Event</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-live="polite">
      <section class="phone-frame">
        <div id="app" class="screen">
          <section class="page sky">
            <div class="status-bar">
              <strong>6:02</strong>
              <span class="status-icons">LTE <span class="battery">14</span></span>
            </div>
            <div class="nav-row">
              <button class="back-button" aria-label="뒤로가기">‹</button>
              <button class="guide-button" aria-label="안내">안내</button>
            </div>
            <div class="hero-center challenge-title">
              <h1>메가커피 타이쿤하고<br /><span class="blue-text">1,000원 할인쿠폰 받기</span></h1>
              <p class="copy">STAGE3까지 모두 레시피대로 완성하세요!<br />점수에 따라 할인쿠폰 금액이 정해져요.</p>
            </div>
            <section class="mission-card challenge-mission">
              <div class="mission-head">
                <div>
                  <h3>STAGE 1</h3>
                </div>
              </div>
              <div class="mission-grid">
                <div class="mission-tile"><span class="tile-number">1</span><span class="recipe-image-slot"><img class="recipe-tile-image" src="./mega_americano_ice.jpg" alt="" /></span><span class="recipe-label">메가리카노<br />(Ice)</span></div>
                <div class="mission-tile"><span class="tile-number">2</span><span class="recipe-image-slot"><img class="recipe-tile-image" src="./카페라떼(hot).jpg" alt="" /></span><span class="recipe-label">카페라떼<br />(Hot)</span></div>
                <div class="mission-tile"><span class="tile-number">3</span><span class="recipe-image-slot"><img class="recipe-tile-image" src="./melon_juice.png" alt="" /></span><span class="recipe-label">꿀수박주스</span></div>
              </div>
            </section>
            <div class="fixed-actions challenge-actions">
              <button class="primary-button">커피 만들기 시작!</button>
            </div>
          </section>
        </div>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
